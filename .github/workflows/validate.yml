name: Validate static export

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run audit:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
      - run: npm run smoke
      - run: npx playwright install --with-deps chromium firefox webkit
      - run: npm test
      - uses: actions/upload-artifact@v4
        with:
          name: validated-export-${{ github.sha }}
          path: |
            out/
            reports/export.json
          retention-days: 3
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: validation-reports-${{ github.sha }}
          path: |
            reports/
            playwright-report/
            test-results/
          retention-days: 3
