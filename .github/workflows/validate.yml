name: Validate static export

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish this reviewed revision (requires production environment approval)
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run audit:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
      - run: npm run smoke
      - run: npx playwright install --with-deps chromium firefox webkit
      - run: npm test
      - uses: actions/upload-artifact@v4
        with:
          name: validated-export-${{ github.sha }}
          path: |
            out/
            reports/export.json
          retention-days: 3
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: validation-reports-${{ github.sha }}
          path: |
            reports/
            playwright-report/
            test-results/
          retention-days: 3

  publish:
    if: github.event_name == 'workflow_dispatch' && inputs.publish && github.ref_name == github.event.repository.default_branch
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    concurrency:
      group: olvr-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          name: validated-export-${{ github.sha }}
      - run: npm run deploy
        env:
          OLVR_PUBLISH: publish-reviewed-export
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          GITHUB_TOKEN: ${{ github.token }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_PROJECT_NAME: ${{ vars.CLOUDFLARE_PROJECT_NAME }}
